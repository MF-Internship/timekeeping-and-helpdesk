name: Quality

on:
  pull_request:
  push:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff format --check backend scripts
      - run: uv run --project backend ruff check backend scripts
      - run: uv run --project backend mypy backend/core backend/config backend/operations scripts
      - run: uv run --project backend pytest backend/tests/unit backend/tests/architecture

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
