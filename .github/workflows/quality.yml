name: Quality

on:
  pull_request:
  push:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: timekeeping_test
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: runtime_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d timekeeping_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://runtime_test:runtime_test_password@127.0.0.1:5432/timekeeping_test
      POSTGRES_TEST_DATABASE_URL: postgresql://runtime_test:runtime_test_password@127.0.0.1:5432/timekeeping_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff format --check backend scripts
      - run: uv run --project backend ruff check backend scripts
      - run: uv run --project backend mypy backend/core backend/config backend/operations backend/identity backend/audit backend/locations scripts
      - run: uv run --project backend python scripts/check_function_length.py backend/core backend/config backend/operations backend/identity backend/audit backend/locations scripts frontend/src/shared/api/client.ts
      - run: uv run --project backend pytest backend/tests/unit backend/tests/architecture backend/tests/contract
      - run: uv run --project backend pytest backend/tests/integration/api
      - run: uv run --project backend pytest -m postgres backend/tests/integration/postgres
      - run: uv run --project backend python scripts/generate_openapi.py --check
      - run: uv run --project backend python scripts/check_openapi.py --all
      - run: uv run --project backend python scripts/check_contract_drift.py
      - run: uv run --project backend python scripts/migration_check.py check

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run api:check
      - run: npm --prefix frontend run build
