      properties:
        accuracy_m:
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          type: string
        captured_at:
          format: date-time
          nullable: true
          type: string
        latitude:
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
          type: string
        longitude:
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,15})?$
