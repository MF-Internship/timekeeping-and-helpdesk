        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
            application/vnd.oai.openapi:
              schema:
                additionalProperties: {}
                type: object
            application/vnd.oai.openapi+json:
              schema:
                additionalProperties: {}
                type: object
            application/yaml:
              schema:
                additionalProperties: {}
                type: object
          description: ''
      security:
