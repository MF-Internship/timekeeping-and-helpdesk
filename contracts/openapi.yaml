openapi: 3.0.3
info:
  title: Timekeeping and Helpdesk API
  version: 1.0.0
paths:
  /api/v1/attendance/check-in:
    post:
      operationId: attendance_check_in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCommand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceCommand'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceCommand'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCommandResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceError'
          description: ''
        '409':
          content:
            application/json:
              examples:
                LocationChoiceRequired:
                  summary: Location choice required
                  value:
                    details: {}
                    error: LOCATION_CHOICE_REQUIRED
                    error_code: LOCATION_CHOICE_REQUIRED
                    location_candidates:
                    - code: LOCATION_A
                      distance_m: '10.000'
                      id: 1
                      name: Location A
                    - code: LOCATION_B
                      distance_m: '20.000'
                      id: 2
                      name: Location B
                    message: Yêu cầu chấm công không được chấp nhận.
                    request_id: 00000000-0000-4000-8000-000000000000
                SessionAlreadyOpen:
                  summary: Session already open
                  value:
                    details: {}
                    error: SESSION_ALREADY_OPEN
                    error_code: SESSION_ALREADY_OPEN
                    message: Yêu cầu chấm công không được chấp nhận.
                    request_id: 00000000-0000-4000-8000-000000000000
              schema:
                $ref: '#/components/schemas/CheckInConflictError'
          description: ''
        '422':
          content:
            application/json:
              examples:
                InvalidChoice:
                  summary: Invalid choice
                  value:
                    details: {}
                    error: INVALID_LOCATION_CHOICE
                    error_code: INVALID_LOCATION_CHOICE
                    location_candidates:
                    - code: LOCATION_A
                      distance_m: '10.000'
                      id: 1
                      name: Location A
                    message: Yêu cầu chấm công không được chấp nhận.
                    request_id: 00000000-0000-4000-8000-000000000000
                OutsideRadius:
                  summary: Outside radius
                  value:
                    details: {}
                    error: OUTSIDE_RADIUS
                    error_code: OUTSIDE_RADIUS
                    message: Yêu cầu chấm công không được chấp nhận.
                    request_id: 00000000-0000-4000-8000-000000000000
                WeakGPS:
                  summary: Weak GPS
                  value:
                    details: {}
                    error: WEAK_GPS
                    error_code: WEAK_GPS
                    message: Yêu cầu chấm công không được chấp nhận.
                    request_id: 00000000-0000-4000-8000-000000000000
              schema:
                $ref: '#/components/schemas/AttendanceUnprocessableError'
          description: ''
      security:
      - bearerAuth: []
      tags:
      - attendance
