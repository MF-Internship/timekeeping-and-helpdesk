components:
  schemas:
    AccessResponse:
      properties:
        access:
          readOnly: true
          type: string
      required:
      - access
      type: object
    AccountsEnum:
      enum:
      - /api/v1/users/
      type: string
    AdminUser:
      properties:
        created_at:
          format: date-time
          readOnly: true
          type: string
        email:
          format: email
          nullable: true
          readOnly: true
          type: string
        full_name:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: integer
        is_active:
          readOnly: true
          type: boolean
        last_login:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        must_change_password:
          readOnly: true
          type: boolean
        phone:
          nullable: true
          readOnly: true
          type: string
        role:
          readOnly: true
          type: string
        username:
          readOnly: true
          type: string
      required:
      - created_at
      - email
      - full_name
      - id
      - is_active
      - last_login
      - must_change_password
      - phone
      - role
      - username
      type: object
    AttendanceCommand:
      properties:
        accuracy_m:
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          type: string
        captured_at:
          format: date-time
          nullable: true
          type: string
        latitude:
