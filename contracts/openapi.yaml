components:
  schemas:
    FoundationError:
      properties:
        details:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        error:
          deprecated: true
          type: string
        error_code:
          description: Governance-authorized error code.
          type: string
        message:
          type: string
        request_id:
          format: uuid
          type: string
      required:
      - error_code
      - message
      - details
      - request_id
      - error
      type: object
