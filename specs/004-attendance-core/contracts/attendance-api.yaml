openapi: 3.0.3
info:
  title: Attendance Core Design Contract
  version: 0.1.0
  description: >-
    Phase 1 design contract for Feature 004. The implementation source of truth
    remains generated contracts/openapi.yaml.
paths:
  /api/v1/attendance/check-in:
    post:
      operationId: attendance_check_in
      summary: Check in the authenticated HELPDESK user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCommandRequest'
      responses:
        '201':
          description: Check In accepted and a session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCommandResponse'
        '400':
          $ref: '#/components/responses/FoundationError'
        '401':
          $ref: '#/components/responses/FoundationError'
        '403':
          $ref: '#/components/responses/FoundationError'
        '409':
          description: Session already open or a Location choice is required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionAlreadyOpenError'
                  - $ref: '#/components/schemas/LocationChoiceRequiredError'
        '422':
          description: Weak GPS, outside all active radii, or invalid Location choice
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GpsBoundaryError'
                  - $ref: '#/components/schemas/InvalidLocationChoiceError'
  /api/v1/attendance/check-out:
    post:
      operationId: attendance_check_out
      summary: Check out the authenticated HELPDESK user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCommandRequest'
      responses:
        '201':
          description: Check Out accepted and the open session closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCommandResponse'
        '400':
          $ref: '#/components/responses/FoundationError'
        '401':
          $ref: '#/components/responses/FoundationError'
        '403':
          $ref: '#/components/responses/FoundationError'
        '409':
          description: No open session or a Location choice is required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NoOpenSessionError'
                  - $ref: '#/components/schemas/LocationChoiceRequiredError'
        '422':
          description: Weak GPS, outside all active radii, or invalid Location choice
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GpsBoundaryError'
                  - $ref: '#/components/schemas/InvalidLocationChoiceError'
  /api/v1/attendance/today:
    get:
      operationId: attendance_today_retrieve
      summary: Read today's attendance for the authenticated HELPDESK user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Actor-scoped local-day attendance projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayAttendanceResponse'
        '401':
          $ref: '#/components/responses/FoundationError'
        '403':
          $ref: '#/components/responses/FoundationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    FoundationError:
      description: Canonical API error without a candidate-choice payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FoundationError'
  schemas:
    AttendanceCommandRequest:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
        - accuracy_m
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          format: double
          minimum: 0
        captured_at:
          type: string
          format: date-time
        selected_location_id:
          type: integer
          format: int64
          minimum: 1
    AttendanceCommandResponse:
      type: object
      additionalProperties: false
      required:
        - attendance
        - session
        - punch_index
      properties:
        attendance:
          $ref: '#/components/schemas/AttendancePunch'
        session:
          $ref: '#/components/schemas/AttendanceSession'
        punch_index:
          type: integer
          minimum: 1
    AttendancePunch:
      type: object
      required:
        - id
        - kind
        - work_date
        - recorded_at
        - captured_at
        - captured_latitude
        - captured_longitude
        - accuracy_m
        - location
        - distance_m
        - validation_result
        - resolution_method
        - maps_url
        - resolved_address
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [IN, OUT]
        work_date:
          type: string
          format: date
        recorded_at:
          type: string
          format: date-time
        captured_at:
          type: string
          format: date-time
          nullable: true
        captured_latitude:
          type: number
          format: double
        captured_longitude:
          type: number
          format: double
        accuracy_m:
          type: number
          format: double
          minimum: 0
        location:
          $ref: '#/components/schemas/AttendanceLocation'
        distance_m:
          type: number
          format: double
          minimum: 0
        validation_result:
          type: string
          enum: [INSIDE_GEOFENCE]
        resolution_method:
          type: string
          enum: [AUTO_SINGLE, USER_SELECTED]
        maps_url:
          type: string
          format: uri
          description: Derived server-side from this punch's stored captured decimal coordinates without rounding or Location-coordinate substitution.
        resolved_address:
          type: string
          nullable: true
    AttendanceLocation:
      type: object
      additionalProperties: false
      required: [id, code, name, address]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        address:
          type: string
    LocationCandidate:
      type: object
      additionalProperties: false
      required: [id, code, name, distance_m]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        distance_m:
          type: number
          format: double
          minimum: 0
    AttendanceSession:
      type: object
      additionalProperties: false
      required:
        - id
        - work_date
        - check_in_at
        - check_out_at
        - check_in_location_id
        - check_out_location_id
        - duration_minutes
        - closed_by_job
      properties:
        id:
          type: integer
          format: int64
        work_date:
          type: string
          format: date
        check_in_at:
          type: string
          format: date-time
        check_out_at:
          type: string
          format: date-time
          nullable: true
        check_in_location_id:
          type: integer
          format: int64
        check_out_location_id:
          type: integer
          format: int64
          nullable: true
        duration_minutes:
          type: number
          format: double
          minimum: 0
          nullable: true
        closed_by_job:
          type: boolean
    TodayAttendanceResponse:
      type: object
      additionalProperties: false
      required:
        - work_date
        - punches
        - sessions
        - total_duration_minutes
        - has_open_session
      properties:
        work_date:
          type: string
          format: date
        punches:
          type: array
          items:
            $ref: '#/components/schemas/IndexedAttendancePunch'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceSession'
        total_duration_minutes:
          type: number
          format: double
          minimum: 0
        has_open_session:
          type: boolean
    IndexedAttendancePunch:
      allOf:
        - $ref: '#/components/schemas/AttendancePunch'
        - type: object
          required: [punch_index]
          properties:
            punch_index:
              type: integer
              minimum: 1
    FoundationError:
      type: object
      required: [error_code, message, details, request_id, error]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          format: uuid
        error:
          type: string
          deprecated: true
      additionalProperties: true
    SessionAlreadyOpenError:
      allOf:
        - $ref: '#/components/schemas/FoundationError'
        - type: object
          required: [error_code]
          properties:
            error_code:
              type: string
              enum: [SESSION_ALREADY_OPEN]
    NoOpenSessionError:
      allOf:
        - $ref: '#/components/schemas/FoundationError'
        - type: object
          required: [error_code]
          properties:
            error_code:
              type: string
              enum: [NO_OPEN_SESSION]
    GpsBoundaryError:
      allOf:
        - $ref: '#/components/schemas/FoundationError'
        - type: object
          required: [error_code]
          properties:
            error_code:
              type: string
              enum: [WEAK_GPS, OUTSIDE_RADIUS]
    LocationChoiceRequiredError:
      allOf:
        - $ref: '#/components/schemas/FoundationError'
        - type: object
          required: [error_code, location_candidates]
          properties:
            error_code:
              type: string
              enum: [LOCATION_CHOICE_REQUIRED]
            location_candidates:
              type: array
              minItems: 2
              items:
                $ref: '#/components/schemas/LocationCandidate'
    InvalidLocationChoiceError:
      allOf:
        - $ref: '#/components/schemas/FoundationError'
        - type: object
          required: [error_code, location_candidates]
          properties:
            error_code:
              type: string
              enum: [INVALID_LOCATION_CHOICE]
            location_candidates:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LocationCandidate'
